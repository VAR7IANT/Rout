name: Repair existing release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag (never created or moved)
        required: true
        type: string
      commit:
        description: Exact original 40-character tag commit
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Validate repair request
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_COMMIT: ${{ inputs.commit }}
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          test "$WORKFLOW_REF" = refs/heads/main
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name' | grep -Fx -- "$RELEASE_TAG"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
      - name: Verify original tag and source version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_COMMIT: ${{ inputs.commit }}
        run: |
          git fetch --depth=1 origin "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$SOURCE_COMMIT"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Test and build the original source
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test "$(go run ./cmd/rout version)" = "rout ${RELEASE_TAG#v}"
          go test ./...
          go test -race ./...
          go vet ./...
          sh scripts/release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-repair
          if-no-files-found: error
          path: |
            dist/rout-linux-amd64
            dist/rout-linux-arm64
            dist/checksums.txt
            dist/version.txt
  upload:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - uses: actions/download-artifact@v4
        with:
          name: release-repair
          path: dist
      - name: Validate artifacts and record the original source dependency
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_COMMIT: ${{ inputs.commit }}
        run: |
          python3 scripts/release_assets.py "$RELEASE_TAG" "$SOURCE_COMMIT" dist --repo "$GITHUB_REPOSITORY" --validate-only
          python3 - <<'PY'
          import json, os
          repo = os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY']
          source = os.environ['SOURCE_COMMIT']
          tag = os.environ['RELEASE_TAG']
          predicate = {
              'buildDefinition': {
                  'buildType': 'https://actions.github.io/buildtypes/workflow/v1',
                  'externalParameters': {
                      'workflow': {'repository': repo, 'path': '.github/workflows/repair-release.yml', 'ref': os.environ['GITHUB_REF']},
                      'source': {'tag': tag, 'commit': source},
                  },
                  'internalParameters': {'github': {
                      'event_name': os.environ['GITHUB_EVENT_NAME'],
                      'repository_id': os.environ['GITHUB_REPOSITORY_ID'],
                      'repository_owner_id': os.environ['GITHUB_REPOSITORY_OWNER_ID'],
                      'runner_environment': os.environ['RUNNER_ENVIRONMENT'],
                  }},
                  'resolvedDependencies': [
                      {'uri': 'git+' + repo + '@' + os.environ['GITHUB_REF'], 'digest': {'gitCommit': os.environ['GITHUB_SHA']}},
                      {'uri': 'git+' + repo + '@refs/tags/' + tag, 'digest': {'gitCommit': source}},
                  ],
              },
              'runDetails': {
                  'builder': {'id': repo + '/.github/workflows/repair-release.yml@' + os.environ['GITHUB_REF']},
                  'metadata': {'invocationId': repo + '/actions/runs/' + os.environ['GITHUB_RUN_ID'] + '/attempts/' + os.environ['GITHUB_RUN_ATTEMPT']},
              },
          }
          with open(os.environ['RUNNER_TEMP'] + '/repair-provenance.json', 'w') as output:
              json.dump(predicate, output)
          PY
      - name: Attest the repaired binaries and their exact original source
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/rout-linux-*
          predicate-type: https://slsa.dev/provenance/v1
          predicate-path: ${{ runner.temp }}/repair-provenance.json
      - name: Verify both build-provenance signatures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify dist/rout-linux-amd64 --repo "$GITHUB_REPOSITORY"
          gh attestation verify dist/rout-linux-arm64 --repo "$GITHUB_REPOSITORY"
      - name: Fill missing assets and verify API and public downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_COMMIT: ${{ inputs.commit }}
        run: python3 scripts/release_assets.py "$RELEASE_TAG" "$SOURCE_COMMIT" dist --repo "$GITHUB_REPOSITORY" --existing-only
