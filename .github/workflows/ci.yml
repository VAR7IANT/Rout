name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Read release version
        id: version
        run: |
          version=$(go run ./cmd/rout version | awk '{print $2}')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo 'Tag does not match the compiled version' >&2
            exit 1
          fi
      - name: Unit tests and static checks
        run: |
          go vet ./...
          go test -race ./...
          sh -n install.sh scripts/release.sh
          test -z "$(gofmt -l cmd internal)"
      - name: Install pinned engines for integration tests
        run: go run ./cmd/rout --home "$RUNNER_TEMP/rout-state" --bin-dir "$RUNNER_TEMP/rout-engines" --service none engines
      - name: Protocol, proxy authentication and TCP/UDP forwarding integration tests
        env:
          ROUT_TEST_ENGINES: ${{ runner.temp }}/rout-engines
        run: go test -race -count=1 -v ./internal/rout
      - name: Service lifecycle, startup rollback and failed-exit isolation
        run: |
          go test -c -o "$RUNNER_TEMP/rout-integration.test" ./internal/rout
          sudo env ROUT_TEST_SYSTEMD=1 ROUT_TEST_ENGINES="$RUNNER_TEMP/rout-engines" "$RUNNER_TEMP/rout-integration.test" -test.run '^TestIntegrationServiceLifecycle$' -test.v
      - name: Build both Linux architectures
        run: sh scripts/release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rout-linux
          path: dist/*
  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rout-linux
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          ROUT_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          tag="v$ROUT_VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; keeping its verified assets"
          else
            gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Rout $tag" --generate-notes
          fi
