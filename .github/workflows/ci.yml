name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Build and test with a currently supported Go release (go.mod keeps 1.23 as the minimum).
          go-version: 'stable'
          cache: false
      - name: Read release version
        id: version
        run: |
          version=$(go run ./cmd/rout version | awk '{print $2}')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo 'Tag does not match the compiled version' >&2
            exit 1
          fi
          grep -q "VERSION=\${ROUT_VERSION:-v$version}" install.sh || { echo 'install.sh default version does not match' >&2; exit 1; }
      - name: Unit tests and static checks
        run: |
          go vet ./...
          go test -race ./...
          sh -n install.sh scripts/release.sh scripts/test-native-hy2.sh
          test -z "$(gofmt -l cmd internal)"
      - name: Vulnerability check (Go standard library and modules)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Install pinned engines for integration tests
        run: |
          go run ./cmd/rout --home "$RUNNER_TEMP/rout-state" --bin-dir "$RUNNER_TEMP/rout-engines" --service none engines
          sh scripts/test-native-hy2.sh "$RUNNER_TEMP/hysteria"
      - name: Protocol, proxy authentication and TCP/UDP forwarding integration tests
        env:
          ROUT_TEST_ENGINES: ${{ runner.temp }}/rout-engines
          ROUT_TEST_HYSTERIA: ${{ runner.temp }}/hysteria
        run: go test -race -count=1 -v ./internal/rout
      - name: systemd lifecycle, sandboxed protocols, startup rollback and failed-exit isolation
        run: |
          go test -c -o "$RUNNER_TEMP/rout-integration.test" ./internal/rout
          sudo env ROUT_TEST_SYSTEMD=1 ROUT_TEST_ENGINES="$RUNNER_TEMP/rout-engines" "$RUNNER_TEMP/rout-integration.test" -test.run '^(TestIntegrationServiceLifecycle|TestIntegrationSystemdSandboxProtocols)$' -test.v
      - name: Kernel accounting, quota recovery and hard quota tests in an isolated network namespace
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables iproute2
          go build -o "$RUNNER_TEMP/rout-manager" ./cmd/rout
          go test -race -c -o "$RUNNER_TEMP/rout-kernel.test" ./internal/rout
          # Real upgrade/rollback against the published, checksum-verified v0.2.1 monitor.
          curl --proto '=https' -fsSL https://github.com/VAR7IANT/Rout/releases/download/v0.2.1/rout-linux-amd64 -o "$RUNNER_TEMP/rout-linux-amd64"
          curl --proto '=https' -fsSL https://github.com/VAR7IANT/Rout/releases/download/v0.2.1/checksums.txt -o "$RUNNER_TEMP/v021-checksums.txt"
          (cd "$RUNNER_TEMP" && grep ' rout-linux-amd64$' v021-checksums.txt | sha256sum -c - && chmod 755 rout-linux-amd64)
          sudo env ROUT_TEST_NFT=1 ROUT_TEST_ENGINES="$RUNNER_TEMP/rout-engines" ROUT_TEST_MANAGER="$RUNNER_TEMP/rout-manager" ROUT_TEST_PREVIOUS_MANAGER="$RUNNER_TEMP/rout-linux-amd64" unshare --net sh -c 'ip link set lo up; exec "$1" -test.run "^(TestKernel|TestIntegrationProtocolsAndProxyExit)" -test.v' sh "$RUNNER_TEMP/rout-kernel.test"
          sudo env ROUT_TEST_TRAFFIC_SYSTEMD=1 ROUT_TEST_ENGINES="$RUNNER_TEMP/rout-engines" ROUT_TEST_MANAGER="$RUNNER_TEMP/rout-manager" "$RUNNER_TEMP/rout-kernel.test" -test.run '^(TestIntegrationTrafficServiceGuard|TestIntegrationTrafficMonitorRestartResumes)$' -test.v
      - name: Alpine Linux / OpenRC service lifecycle in a disposable container
        run: |
          CGO_ENABLED=0 go test -c -o "$RUNNER_TEMP/rout-static.test" ./internal/rout
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/rout-static" ./cmd/rout
          # Boot OpenRC as PID 1 (sysinit/boot/default) like a real Alpine host; Rout itself
          # must select the static musl engines there (no glibc loader).
          docker run -d --name alpine-openrc --privileged -v "$RUNNER_TEMP:/w" alpine:3.20 sh -c '
            apk add --no-cache openrc >/dev/null
            sed -i "s/^#\{0,1\}rc_sys=.*/rc_sys=\"docker\"/" /etc/rc.conf
            printf "::sysinit:/sbin/openrc sysinit\n::sysinit:/sbin/openrc boot\n::wait:/sbin/openrc default\n::shutdown:/sbin/openrc shutdown\n" > /etc/inittab
            exec /sbin/init'
          for i in $(seq 1 60); do docker exec alpine-openrc test -x /sbin/openrc-run && docker exec alpine-openrc rc-status >/dev/null 2>&1 && break; sleep 2; done; sleep 3
          docker exec alpine-openrc sh -euc '
            /w/rout-static --home /tmp/state --bin-dir /tmp/engines --service none engines
            cd /w && ROUT_TEST_ENGINES=/tmp/engines ./rout-static.test -test.run "^(TestIntegrationProtocolsAndProxyExit|TestIntegrationGOSTTCPAndUDP)$" -test.v
            ROUT_TEST_OPENRC=1 ROUT_TEST_ENGINES=/tmp/engines ./rout-static.test -test.run "^TestIntegrationOpenRCLifecycle$" -test.v || { rc-status -a; exit 1; }'
          docker rm -f alpine-openrc
      - name: Build both Linux architectures
        run: sh scripts/release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rout-linux
          path: dist/*
  # Production releases are published only from an explicit, matching version tag.
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rout-linux
          path: dist
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/rout-linux-*
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          ROUT_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          tag="v$ROUT_VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; keeping its verified assets"
          else
            awk -v heading="## v$ROUT_VERSION" '$0 == heading { found=1; next } found && /^## / { exit } found { print }' CHANGELOG.md > release-notes.md
            printf '\nVerify a downloaded binary with: gh attestation verify rout-linux-amd64 --repo %s\n' "$GITHUB_REPOSITORY" >> release-notes.md
            printf 'Accounting scope, fault policy and real-host acceptance boundaries: https://github.com/%s/blob/%s/docs/TRAFFIC.md\n' "$GITHUB_REPOSITORY" "$tag" >> release-notes.md
            gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --target "$GITHUB_SHA" --title "Rout $tag" --notes-file release-notes.md
          fi
